version: '3'
services:
  mysql:
    container_name: some-mysql
    image: mysql:5.7
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: admin
      MYSQL_DATABASE: prestashop
    networks:
      - selenoid
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 5s
      retries: 5

  prestashop:
    container_name: prestashop
    image: prestashop/prestashop:latest
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - 8080:80
    environment:
      DB_SERVER: some-mysql
      DB_NAME: prestashop
      DB_USER: root
      DB_PASSWD: admin
      PS_INSTALL_AUTO: 1
      PS_DOMAIN: prestashop
    networks:
      selenoid:
        aliases:
          - localhost
    healthcheck:
      test: ["CMD", "test", "-f", "/var/www/html/index.php"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  tests:
    image: prestashop-tests
    depends_on:
      prestashop:
        condition: service_healthy
    networks:
      - selenoid
    command: tests/ --url http://localhost:8080 --browser chrome

networks:
  selenoid:
    external: true